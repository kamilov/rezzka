name: Check and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify npm version
        run: test "$(npm --version)" = "10.9.9"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node --input-type=module -e 'import fs from "node:fs"; const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version; if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error("Tag must match package.json version"); if (!fs.readFileSync("CHANGELOG.md", "utf8").split("\n").some(l => { const [h, v] = l.split(" "); return h === "##" && v === version; })) throw new Error(`CHANGELOG.md has no section for ${version}`);'
      - run: npm run package:tv
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rezzka-${{ github.sha }}
          path: |
            artifacts/*.ipk
            artifacts/*.sha256
            artifacts/LICENSE
            artifacts/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          retention-days: 14
      - name: Save browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-tests-${{ github.sha }}
          path: test-results/
          retention-days: 7

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rezzka-${{ github.sha }}
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v ver="${TAG#v}" '$1 == "##" && $2 == ver {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Rezzka ${TAG#v}" --notes-file notes.md release/*
